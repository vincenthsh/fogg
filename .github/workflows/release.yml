on:
  push:
    branches:
      - feat-multi-module-components
  # Manual npm publish through this workflow file, which is the one the npm
  # trusted publisher is bound to. Use it to re-publish a release whose
  # release-please run already happened (release_created is only true once)
  # after a failed publish. pnpm skips versions already on npm.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pack only, no publish). Uncheck to actually publish."
        type: boolean
        default: true
      go_release_tag:
        description: "Instead of npm: build and upload GoReleaser binaries for this existing fogg tag (e.g. v0.95.3)."
        type: string
        default: ""

name: release-please
env:
  CI: true
jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # npm trusted publishing (OIDC): pnpm exchanges this job's GitHub OIDC
      # token for a short-lived npm publish token. Requires a trusted publisher
      # configured on npmjs.com for @vincenthsh/cdktf-fogg-helpers
      # (repo vincenthsh/fogg, workflow release.yml).
      id-token: write
    steps:
      - name: release please
        uses: google-github-actions/release-please-action@v4.1.1
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          # https://github.com/google-github-actions/release-please-action#github-credentials
          token: ${{ secrets.VINCENT_PAT }}

      ## publish Go release
      # Built from the fogg (root) tag in its own checkout with GORELEASER_CURRENT_TAG, not from
      # HEAD: HEAD can be ahead of the release commit (re-runs), and the helpers tag sits on the
      # same commit, which made GoReleaser pick cdktf-fogg-helpers-v* as the current tag.

      - name: Resolve fogg release tag
        id: go
        run: echo "tag=${GO_TAG}" >> "$GITHUB_OUTPUT"
        env:
          GO_TAG: ${{ steps.release.outputs.release_created && steps.release.outputs.tag_name || inputs.go_release_tag }}
        if: ${{ steps.release.outputs.release_created || (github.event_name == 'workflow_dispatch' && inputs.go_release_tag != '') }}

      - uses: actions/checkout@v7
        # full history and tags so GoReleaser computes the changelog / previous tag
        with:
          fetch-depth: 0
          ref: ${{ steps.go.outputs.tag }}
          path: go-release
        if: ${{ steps.go.outputs.tag != '' }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go-release/go.mod
        if: ${{ steps.go.outputs.tag != '' }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
          workdir: go-release
        env:
          GITHUB_TOKEN: ${{ secrets.VINCENT_PAT }}
          GORELEASER_CURRENT_TAG: ${{ steps.go.outputs.tag }}
        if: ${{ steps.go.outputs.tag != '' }}

      ## publish CDKTF pkg
      # Gated on the helpers path's own release (release_created only covers the root package,
      # and helpers-only releases happen since root exclude-paths ignores packages/).

      - uses: actions/checkout@v7
        if: ${{ !cancelled() && (steps.release.outputs['packages/cdktf-fogg-constructs--release_created'] || (github.event_name == 'workflow_dispatch' && inputs.go_release_tag == '')) }}

      # pnpm required for setup-node cache support
      # ref:
      # - https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
      # - https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-nodejs-packages#publishing-packages-to-github-packages
      # - https://pnpm.io/using-changesets#publishing
      - name: Setup pnpm from .packageManager
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false
        if: ${{ !cancelled() && (steps.release.outputs['packages/cdktf-fogg-constructs--release_created'] || (github.event_name == 'workflow_dispatch' && inputs.go_release_tag == '')) }}
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          registry-url: 'https://registry.npmjs.org'
        if: ${{ !cancelled() && (steps.release.outputs['packages/cdktf-fogg-constructs--release_created'] || (github.event_name == 'workflow_dispatch' && inputs.go_release_tag == '')) }}
      - name: Run pnpm Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        if: ${{ !cancelled() && (steps.release.outputs['packages/cdktf-fogg-constructs--release_created'] || (github.event_name == 'workflow_dispatch' && inputs.go_release_tag == '')) }}
      - name: Run pnpm Publish
        # Authenticates with npm trusted publishing (OIDC, id-token: write above).
        # No NPM_TOKEN: the npm trusted publisher for this package is bound to
        # vincenthsh/fogg + release.yml. pnpm skips versions already on npm.
        # On a manual dispatch dry_run defaults to true; push events always publish.
        run: pnpm ci:publish ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        if: ${{ !cancelled() && (steps.release.outputs['packages/cdktf-fogg-constructs--release_created'] || (github.event_name == 'workflow_dispatch' && inputs.go_release_tag == '')) }}
