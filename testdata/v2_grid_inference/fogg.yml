defaults:
  backend:
    kind: s3
    bucket: some-bucket
    region: us-west-2
    profile: profile
  grid:
    enabled: true
  owner: foo@example.com
  project: proj
  tools:
    atlantis:
      enabled: true
      # if depends_on is defined, don't ignore `remote-state.tf`
      autoplan_remote_states: true
      version: 3
      automerge: true
      parallel_plan: true
      parallel_apply: true
  providers:
    aws:
      account_id: 00456
      profile: profile
      region: us-west-2
      version: 0.12.0
  terraform_version: 0.100.0
grid:
  endpoint: http://localhost:8080
global:
  grid:
    enabled: false
envs:
  test:
    components:
      vpc:
        depends_on:
          components: []
        grid:
          # fixed guid for test consistency
          guid: "11111111-2222-3333-4444-555555555555"
        modules:
          - name: "vpc"
            source: "terraform-aws-modules/vpc/aws"
            version: "4.0.1"
            for_each: "local.map"
            variables:
              - name
              - cidr
              - azs
              - private_subnets
              - public_subnets
              - tags
      existing: # this is an existing component on disk
        depends_on:
          components:
            - vpc # infer outputs
        modules:
          - source: "terraform/modules/my_module"
modules:
  my_module: {}
version: 2
